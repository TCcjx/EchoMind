<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-label="EchoMind 多 Agent 智能客服运行时">
  <title>EchoMind — Multi-Agent Customer Service Runtime</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080f"/>
      <stop offset="0.5" stop-color="#0a1120"/>
      <stop offset="1" stop-color="#0e1c33"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#14243c" stroke-width="1" opacity="0.5"/>
    </pattern>
    <style><![CDATA[
      .f { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .kicker { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #22d3ee; letter-spacing: 5px; }
      .brand { font: 800 92px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #f4f9ff; letter-spacing: -1px; }
      .sub { font: 600 34px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #cfe0f5; }
      .chain { font: 600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #9fe6f5; }
      .desc { font: 400 22px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #8ea6c4; }
      .tag { font: 600 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .stack { font: 500 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #5d7695; letter-spacing: 1px; }
      .nodeT { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #e8f3ff; }
      .nodeS { font: 400 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #8ba4c2; }
      .hubT { font: 800 32px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .hubS { font: 500 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #9fd8e8; }
    ]]></style>
  </defs>

  <rect width="1600" height="620" fill="url(#bg)"/>
  <rect width="1600" height="620" fill="url(#grid)"/>
  <ellipse cx="1240" cy="110" rx="520" ry="360" fill="url(#glowCyan)"/>
  <ellipse cx="170" cy="560" rx="460" ry="320" fill="url(#glowIndigo)"/>
  <rect x="0" y="616" width="1600" height="4" fill="url(#accent)" opacity="0.6"/>

  <!-- ================= 左栏：品牌与定位 ================= -->
  <text class="kicker f" x="88" y="132">MULTI-AGENT RUNTIME</text>
  <text class="brand f" x="88" y="238">EchoMind</text>
  <rect x="90" y="266" width="200" height="6" rx="3" fill="url(#accent)"/>
  <text class="sub f" x="88" y="330">多 Agent 智能客服运行时</text>

  <text class="chain f" x="88" y="392">记忆 → 意图 → 检索 → 路由 → 协作 → 生成 → 写回 → 评测</text>
  <text class="desc f" x="88" y="430">一条消息走完完整闭环，可观测 · 可评测 · 可降级</text>

  <g>
    <rect x="88" y="472" width="176" height="46" rx="23" fill="#22d3ee" fill-opacity="0.10" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text class="tag f" x="136" y="502" fill="#a5e9f6">可观测</text>
    <rect x="284" y="472" width="176" height="46" rx="23" fill="#60a5fa" fill-opacity="0.10" stroke="#60a5fa" stroke-opacity="0.5"/>
    <text class="tag f" x="332" y="502" fill="#bcd9ff">可评测</text>
    <rect x="480" y="472" width="176" height="46" rx="23" fill="#a78bfa" fill-opacity="0.10" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text class="tag f" x="528" y="502" fill="#d3c6ff">可降级</text>
  </g>

  <text class="stack f" x="88" y="560">Python · FastAPI · Vue 3 · Redis · ChromaDB · Prometheus</text>

  <!-- ================= 右栏：路由拓扑示意 ================= -->
  <g>
    <!-- 输入 -->
    <rect x="872" y="270" width="120" height="62" rx="12" fill="#0f1e33" stroke="#28405f"/>
    <text class="nodeT f" x="932" y="297" text-anchor="middle">IN</text>
    <text class="nodeS f" x="932" y="319" text-anchor="middle">用户消息</text>

    <!-- IN → Router：纯色直线 + 实心箭头 -->
    <path d="M996 301 H1076" stroke="#22d3ee" stroke-opacity="0.85" stroke-width="2"/>
    <path d="M1076 293 L1090 301 L1076 309 Z" fill="#22d3ee"/>

    <!-- 中心路由器 -->
    <circle cx="1180" cy="301" r="94" fill="#22d3ee" fill-opacity="0.04"/>
    <circle cx="1180" cy="301" r="78" fill="#0b1a2e" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="1.6"/>
    <circle cx="1180" cy="301" r="62" fill="#0e2138" stroke="#2f5c7a"/>
    <text class="hubT f" x="1180" y="295" text-anchor="middle">Router</text>
    <text class="hubS f" x="1180" y="322" text-anchor="middle">三级路由</text>

    <!-- Router → 四个 Agent：纯色曲线 + 实心箭头（箭头尖贴卡片左缘 x=1340） -->
    <path d="M1258 287 C1300 262 1316 208 1326 180" stroke="#22d3ee" stroke-opacity="0.8" stroke-width="2" fill="none"/>
    <path d="M1326 170 L1338 177 L1326 184 Z" fill="#22d3ee"/>

    <path d="M1258 300 C1304 297 1316 274 1326 268" stroke="#60a5fa" stroke-opacity="0.8" stroke-width="2" fill="none"/>
    <path d="M1326 258 L1338 265 L1326 272 Z" fill="#60a5fa"/>

    <path d="M1258 315 C1304 322 1316 366 1326 372" stroke="#818cf8" stroke-opacity="0.8" stroke-width="2" fill="none"/>
    <path d="M1326 366 L1338 373 L1326 380 Z" fill="#818cf8"/>

    <path d="M1258 328 C1300 352 1316 450 1326 478" stroke="#c084fc" stroke-opacity="0.8" stroke-width="2" fill="none"/>
    <path d="M1326 474 L1338 481 L1326 488 Z" fill="#c084fc"/>

    <!-- 连线上的流动光点 -->
    <circle cx="1300" cy="230" r="4" fill="#22d3ee">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1300" cy="320" r="4" fill="#818cf8">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="2.6s" begin="-0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1296" cy="400" r="4" fill="#c084fc">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="2.6s" begin="-1.7s" repeatCount="indefinite"/>
    </circle>

    <!-- Agent 节点 -->
    <g>
      <rect x="1340" y="144" width="200" height="66" rx="12" fill="#101d31" stroke="#2b4560"/>
      <rect x="1340" y="144" width="4" height="66" rx="2" fill="#22d3ee"/>
      <text class="nodeT f" x="1364" y="172">General</text>
      <text class="nodeS f" x="1364" y="196">通用问答</text>

      <rect x="1340" y="232" width="200" height="66" rx="12" fill="#101d31" stroke="#2b4560"/>
      <rect x="1340" y="232" width="4" height="66" rx="2" fill="#60a5fa"/>
      <text class="nodeT f" x="1364" y="260">Technical</text>
      <text class="nodeS f" x="1364" y="284">技术排查</text>

      <rect x="1340" y="340" width="200" height="66" rx="12" fill="#101d31" stroke="#2b4560"/>
      <rect x="1340" y="340" width="4" height="66" rx="2" fill="#818cf8"/>
      <text class="nodeT f" x="1364" y="368">Billing</text>
      <text class="nodeS f" x="1364" y="392">账单账务</text>

      <rect x="1340" y="448" width="200" height="66" rx="12" fill="#101d31" stroke="#2b4560"/>
      <rect x="1340" y="448" width="4" height="66" rx="2" fill="#c084fc"/>
      <text class="nodeT f" x="1364" y="476">Escalation</text>
      <text class="nodeS f" x="1364" y="500">人工升级</text>
    </g>

    <!-- Router → Response：曲线 + 箭头（尖端贴卡顶 y=470） -->
    <path d="M1180 379 C1180 424 1146 450 1110 462" stroke="#22d3ee" stroke-opacity="0.8" stroke-width="2" fill="none"/>
    <path d="M1096 468 L1110 468 L1106 459 Z" fill="#22d3ee"/>
    <rect x="966" y="470" width="240" height="62" rx="12" fill="#0f1e33" stroke="#28405f"/>
    <text class="nodeT f" x="1086" y="497" text-anchor="middle">Response</text>
    <text class="nodeS f" x="1086" y="519" text-anchor="middle">回复 + 记忆写回</text>
  </g>
</svg>
